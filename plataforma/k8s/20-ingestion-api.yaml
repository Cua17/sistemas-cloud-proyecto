# Microservicio de ingestion + la base de datos SQLite (en un volumen persistente).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ingestion-datos
  namespace: nubeultima
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 200Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: nubeultima
spec:
  replicas: 1
  strategy: { type: Recreate }          # una sola replica escribe el SQLite
  selector:
    matchLabels: { app: ingestion-api }
  template:
    metadata:
      labels: { app: ingestion-api }
    spec:
      nodeSelector:
        kubernetes.io/hostname: nubeultima-worker   # fija el pod donde vive su disco
      containers:
        - name: ingestion-api
          image: nubeultima/ingestion-api:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: MQTT_HOST, value: "mqtt-broker" }
            - { name: DB_PATH,   value: "/data/nubeultima.db" }
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: datos
              mountPath: /data
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          resources:
            requests: { memory: "96Mi", cpu: "50m" }
            limits:   { memory: "200Mi" }
      volumes:
        - name: datos
          persistentVolumeClaim: { claimName: ingestion-datos }
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
  namespace: nubeultima
spec:
  selector: { app: ingestion-api }
  ports:
    - port: 8000
      targetPort: 8000
