# Simulador de dispositivos IoT (la "ultima milla").
# replicas: 1 para la demo. Se puede escalar a 0 para dejar de generar datos:
#   kubectl -n nubeultima scale deploy/device-simulator --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-simulator
  namespace: nubeultima
spec:
  replicas: 1
  selector:
    matchLabels: { app: device-simulator }
  template:
    metadata:
      labels: { app: device-simulator }
    spec:
      nodeSelector:
        kubernetes.io/hostname: nubeultima-worker
      containers:
        - name: device-simulator
          image: nubeultima/device-simulator:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: MQTT_HOST,        value: "mqtt-broker" }
            - { name: ZONAS,            value: "zona-1,zona-2,zona-3,zona-4" }
            - { name: DEVICES_POR_ZONA, value: "1" }
            - { name: INTERVALO_SEG,    value: "15" }
            - { name: ANOMALIA_PROB,    value: "0.04" }
          resources:
            requests: { memory: "32Mi", cpu: "20m" }
            limits:   { memory: "64Mi" }
