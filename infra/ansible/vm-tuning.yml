---
# infra/ansible/vm-tuning.yml
# Ajustes de memoria/disco para las VMs (Raspberry Pi 4 de 4 GB):
#   - zram: swap comprimido en RAM (colchon contra OOM, sin tocar el qcow2)
#   - journald a RAM
#   - swappiness bajo (preferir RAM antes que swap)

- name: Tuning de las VMs para poca RAM
  hosts: centro_datos
  become: true

  tasks:
    - name: Instalar systemd-zram-generator
      ansible.builtin.apt:
        name: systemd-zram-generator
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configurar zram (50% de la RAM, zstd)
      ansible.builtin.copy:
        dest: /etc/systemd/zram-generator.conf
        content: |
          [zram0]
          zram-size = ram / 2
          compression-algorithm = zstd

    - name: Crear el directorio de configuracion de journald
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Logs de journald a RAM
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/00-volatile.conf
        content: |
          [Journal]
          Storage=volatile
          RuntimeMaxUse=32M

    - name: Preferir RAM antes que swap (swappiness)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-nubeultima.conf
        content: "vm.swappiness = 20\n"

    - name: Aplicar swappiness ahora
      ansible.builtin.command: sysctl -w vm.swappiness=20
      changed_when: false

    - name: Recargar systemd y activar zram
      ansible.builtin.shell: |
        systemctl daemon-reload
        systemctl restart systemd-zram-setup@zram0.service
        systemctl restart systemd-journald
      changed_when: true

    - name: Verificar que zram esta activo
      ansible.builtin.command: swapon --show=NAME,SIZE --noheadings
      register: swap_out
      changed_when: false

    - name: Mostrar swap de la VM
      ansible.builtin.debug:
        msg: "swap: {{ swap_out.stdout | default('(vacio)') }}"
