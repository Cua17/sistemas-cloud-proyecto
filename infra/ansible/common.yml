---
# infra/ansible/common.yml
# Configuracion base, identica y reproducible, para las 3 VMs del centro de datos.
# Se ejecuta desde la Raspberry Pi:
#   ansible-playbook -i infra/ansible/inventory.ini infra/ansible/common.yml
#
# Concepto: un "playbook" describe el ESTADO DESEADO. Ansible compara con el estado
# actual y solo cambia lo que haga falta (idempotente: correrlo 2 veces no rompe nada).

- name: Configuracion base del centro de datos
  hosts: centro_datos
  become: true            # ejecutar las tareas como root (sudo)

  tasks:
    - name: Instalar utilidades de red y diagnostico
      ansible.builtin.apt:
        name:
          - iperf3         # medir ancho de banda y jitter entre VMs
          - htop           # ver uso de CPU/RAM en vivo
          - jq             # procesar JSON en la linea de comandos
          - curl
          - chrony         # sincronizacion de hora (NTP)
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Habilitar y arrancar chrony (sincronizacion de hora)
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: Registrar los nombres de las 3 VMs en /etc/hosts
      # Asi cualquier VM resuelve "nubeultima-worker" -> 192.168.100.12 sin DNS.
      # El direccionamiento sigue siendo 100% estatico.
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} NUBEULTIMA - centro de datos"
        block: |
          192.168.100.11 nubeultima-control
          192.168.100.12 nubeultima-worker
          192.168.100.13 nubeultima-storage

    - name: Endurecer SSH - solo autenticacion por llave, sin root
      # OJO: sshd usa el PRIMER valor que encuentra para cada opcion, y los .conf de
      # sshd_config.d/ se leen en orden alfabetico. cloud-init deja un
      # "50-cloud-init.conf" con "PasswordAuthentication yes"; para ganarle, nuestro
      # archivo tiene que leerse ANTES -> prefijo "00-".
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-nubeultima-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Gestionado por Ansible (common.yml) - NubeUltima
          PasswordAuthentication no
          PermitRootLogin no
          KbdInteractiveAuthentication no
      notify: Reiniciar SSH

  handlers:
    - name: Reiniciar SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
