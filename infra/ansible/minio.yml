---
# infra/ansible/minio.yml
# Instala MinIO (almacenamiento de objetos compatible con S3) en la VM storage.
# Es el "servicio de respaldo portador" del BaaS: las demas maquinas le mandan
# sus copias por la misma API que usaria Amazon S3.
#
# Uso (en la Pi):
#   ansible-playbook -i infra/ansible/inventory.ini infra/ansible/minio.yml \
#     -e minio_root_password='<clave-larga>'

- name: MinIO en la VM de almacenamiento
  hosts: nubeultima-storage
  become: true
  vars:
    minio_root_user: nubeultima
    minio_root_password: "{{ lookup('env', 'MINIO_ROOT_PASSWORD') | default('cambiar-esta-clave-123', true) }}"
    minio_bin_url: "https://dl.min.io/server/minio/release/linux-arm64/minio"
    mc_bin_url: "https://dl.min.io/client/mc/release/linux-arm64/mc"

  tasks:
    - name: Usuario y directorios de MinIO
      block:
        - ansible.builtin.user:
            name: minio-user
            system: true
            shell: /usr/sbin/nologin
            home: /home/minio
            create_home: true
        - ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: minio-user
            group: minio-user
          loop:
            - /data/minio
            - /etc/minio

    - name: Descargar el binario de MinIO (ARM64, sitio oficial)
      ansible.builtin.get_url:
        url: "{{ minio_bin_url }}"
        dest: /usr/local/bin/minio
        mode: "0755"
      register: minio_dl
      retries: 3
      delay: 5
      until: minio_dl is succeeded

    - name: Descargar el cliente mc
      ansible.builtin.get_url:
        url: "{{ mc_bin_url }}"
        dest: /usr/local/bin/mc
        mode: "0755"
      retries: 3
      delay: 5

    - name: Variables de entorno de MinIO
      ansible.builtin.copy:
        dest: /etc/default/minio
        mode: "0640"
        content: |
          MINIO_ROOT_USER={{ minio_root_user }}
          MINIO_ROOT_PASSWORD={{ minio_root_password }}
          MINIO_VOLUMES=/data/minio
          MINIO_OPTS="--address :9000 --console-address :9001"
      no_log: true

    - name: Servicio systemd de MinIO
      ansible.builtin.copy:
        dest: /etc/systemd/system/minio.service
        content: |
          [Unit]
          Description=MinIO (BaaS de NubeUltima)
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=minio-user
          Group=minio-user
          EnvironmentFile=/etc/default/minio
          ExecStart=/usr/local/bin/minio server $MINIO_OPTS $MINIO_VOLUMES
          Restart=always
          RestartSec=5
          # limite de memoria acorde a una VM chica
          MemoryMax=380M
          [Install]
          WantedBy=multi-user.target
      notify: reiniciar minio

    - name: Habilitar y arrancar MinIO
      ansible.builtin.systemd:
        name: minio
        state: started
        enabled: true
        daemon_reload: true

    - name: Esperar a que MinIO responda
      ansible.builtin.uri:
        url: "http://localhost:9000/minio/health/ready"
        status_code: 200
      register: h
      retries: 12
      delay: 5
      until: h.status == 200

    - name: Crear el bucket de respaldos con mc
      ansible.builtin.shell: |
        mc alias set local http://localhost:9000 {{ minio_root_user }} {{ minio_root_password }}
        mc mb --ignore-existing local/nubeultima-backups
      no_log: true
      changed_when: false

  handlers:
    - name: reiniciar minio
      ansible.builtin.systemd:
        name: minio
        state: restarted
        daemon_reload: true
