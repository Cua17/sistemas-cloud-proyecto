# Inventario de Ansible - las 3 VMs del centro de datos NubeUltima.
# Ansible se ejecuta DESDE la Raspberry Pi contra estas 3 VMs.

[centro_datos]
nubeultima-control  ansible_host=192.168.100.11
nubeultima-worker   ansible_host=192.168.100.12
nubeultima-storage  ansible_host=192.168.100.13

[centro_datos:vars]
ansible_user=pi
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no
