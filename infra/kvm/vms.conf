# Definicion de las 3 VMs del centro de datos NubeUltima.
# Formato:  nombre  ip  ram_mb  vcpus  disco_gb
# (lineas que empiezan con # se ignoran)
#
# Memoria para una Raspberry Pi 4 de 4 GB.
# Fase 2 (K3s): control corre el server (mas pesado), worker el agent + los pods,
# storage queda chica (solo se usa a fondo en Fase 3 con MinIO).
# Total invitados = 3112 MB; el host + QEMU usan el resto + zram como colchon.

nubeultima-control  192.168.100.11  1400  2  8
nubeultima-worker   192.168.100.12  1200  2  8
nubeultima-storage  192.168.100.13  512   1  6
