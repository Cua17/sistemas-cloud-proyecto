# Definicion de las 3 VMs del centro de datos NubeUltima.
# Formato:  nombre  ip  ram_mb  vcpus  disco_gb
# (lineas que empiezan con # se ignoran)
#
# Memoria pensada para una Raspberry Pi 4 de 4 GB (deja ~700 MB para el host).

nubeultima-control  192.168.100.11  900   2  6
nubeultima-worker   192.168.100.12  1024  2  6
nubeultima-storage  192.168.100.13  640   1  6
